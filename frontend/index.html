<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Union is a document editor where several people can write in the same document at once." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>The Union</title>
    <script>
      try {
        const theme = localStorage.getItem('union.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
