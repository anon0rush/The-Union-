services:
  union:
    build: .
    ports:
      - "4000:4000"
    environment:
      # Generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CLIENT_ORIGIN: http://localhost:4000
      PUBLIC_URL: http://localhost:4000
    volumes:
      - union-data:/data
    restart: unless-stopped

volumes:
  union-data:
